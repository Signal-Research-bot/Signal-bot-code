name: ci

# CI is where the privacy checks are actually enforced. Pre-commit is a local
# convenience that `--no-verify` and `SKIP=` both bypass; this cannot be.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the identity audit below has to see every commit, not
          # just the tip. .gitignore is not retroactive and neither is a
          # shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Mutation test the egress firewall
        # Proves the test suite would go red if the firewall were weakened.
        # A green suite alone only says it works on the inputs it was given.
        run: python -m tools.mutation_test

      - name: Scrub check (full tree)
        env:
          # The real token list is a gitignored file that does not exist in CI.
          # Supply it as a repository secret for full coverage; without it the
          # structural rules (absolute paths, emails, UUIDs, phone shapes) still
          # run and the reduced coverage is printed rather than hidden.
          SCRUB_TOKENS: ${{ secrets.SCRUB_TOKENS }}
        run: |
          if [ -n "$SCRUB_TOKENS" ]; then
            python -m tools.scrub_check --all
          else
            python -m tools.scrub_check --all --structural-only
          fi

      - name: Identity audit
        run: |
          echo "Commit authors:"
          git log --format='%an <%ae>' | sort -u
          if git log --format='%ae' | grep -vE '@users\.noreply\.github\.com$' | grep -q .; then
            echo "::error::a commit carries a real mailbox; expected users.noreply only"
            exit 1
          fi

      - name: No absolute paths
        run: |
          if git grep -nE '(?<![A-Za-z0-9])[A-Za-z]:[\\/]' -- \
               ':!tools/scrub_check.py' ':!tests/test_scrub.py' ':!*.md'; then
            echo "::error::absolute path found in a tracked file"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build signal-cli image
        # Verifies the pinned version and SHA-256 still resolve. If upstream
        # ever moves a release artefact, this fails here rather than on the
        # operator's machine at 3am.
        run: docker build -f docker/Dockerfile.signal-cli -t srb-signal-cli:ci .

      - name: Verify it is the native build with no JRE
        run: |
          docker run --rm srb-signal-cli:ci signal-cli --version
          if docker run --rm --entrypoint sh srb-signal-cli:ci -c 'command -v java'; then
            echo "::error::a JRE is present; the native build was expected"
            exit 1
          fi

      - name: Build worker image
        run: docker build -f docker/Dockerfile.worker -t srb-worker:ci .

      - name: Verify the worker fails closed without configuration
        run: |
          if docker run --rm srb-worker:ci python -m signal_research_bot.run_receiver; then
            echo "::error::receiver started without SRB_GROUP_ID; it must fail closed"
            exit 1
          fi
