# Nothing host-specific belongs in this file -- it is published. Every path is
# a named volume, every name is static, and anything that varies by machine
# comes from .env (see .env.example).
#
# This lives at the repo ROOT, not in docker/, and that is deliberate. Compose
# resolves .env relative to the compose file's own directory, so a compose file
# under docker/ silently ignores the .env beside it at the root -- every
# variable comes through empty with no warning. Keeping it here also means the
# operator never types -f.
#
# Named volumes live inside the WSL2 VHDX on whichever drive Docker Desktop is
# configured to use. Check that before first run: a Docker Desktop reinstall
# can silently reset the disk image location back to C:.

name: signal-research-bot

# The JSON-RPC port is NOT published to the host. Anyone who can reach it can
# send messages as the operator and read the account's state -- it is
# equivalent to the Signal account itself. Only the worker needs it, and the
# compose network is enough for that.
networks:
  # NOT `internal: true`, despite the name. Both services need outbound
  # internet: signal-cli talks to Signal's servers and the worker talks to the
  # Anthropic API, so an isolated network would break the system outright.
  #
  # What the name means here is that no port is published to the host, so
  # nothing outside Docker can reach the JSON-RPC socket. An audit flagged the
  # name as implying a containment property it does not have; the property it
  # does have is stated above rather than assumed from the word.
  internal:
    driver: bridge

volumes:
  signal-data:      # linked-device identity keys. Back up only while stopped.
  cache:            # unredacted message cache, SQLCipher-encrypted.

# Docker's default json-file driver has NO size limit. A 24/7 chatty container
# grows the VHDX until the disk fills, and the VHDX does not shrink back.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  signal-cli:
    build:
      context: .
      dockerfile: docker/Dockerfile.signal-cli
    container_name: srb-signal-cli
    restart: unless-stopped
    networks: [internal]
    volumes:
      - signal-data:/data
    logging: *logging
    healthcheck:
      # Checks that the port is LISTENING, without connecting to it.
      #
      # The previous version opened a TCP connection and dropped it, with a
      # comment explaining why that would be harmful -- it did the exact thing
      # it warned against. Under --receive-mode=on-connection the connection IS
      # the subscription: signal-cli starts its fetch loop when a client
      # connects and stops when the last one disconnects. A probe that connects
      # and drops every 60s churns that loop, and in the window where the worker
      # is down it is *worse* than no probe at all, because it makes signal-cli
      # fetch (and acknowledge) messages with nothing on the other end to
      # persist them. That is silent, permanent message loss.
      #
      # /proc/net/tcp is read-only and needs no extra package. 0x1D9F == 7583,
      # state 0A == TCP_LISTEN.
      test: ["CMD-SHELL", "grep -qi ':1D9F .* 0A ' /proc/net/tcp || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: srb-worker
    restart: unless-stopped
    depends_on:
      signal-cli:
        condition: service_healthy
    networks: [internal]
    volumes:
      - cache:/cache
    environment:
      SRB_SIGNAL_HOST: signal-cli
      SRB_SIGNAL_PORT: "7583"
      SRB_GROUP_ID: ${SRB_GROUP_ID:-}   # deliberately NOT ${VAR:?...}: it is
        # unknowable until after `--profile link`, and a required-var marker
        # here blocks the build you need in order to link. config.py validates
        # it at startup with a better message than compose can give.
      SRB_CACHE_KEY: ${SRB_CACHE_KEY:?set SRB_CACHE_KEY in .env}
      SRB_LOG_LEVEL: ${SRB_LOG_LEVEL:-INFO}
    logging: *logging

  # --- one-shot profiles ----------------------------------------------------

  # Interactive, once, to link this container as a device on the operator's
  # account:  docker compose --profile link run --rm link
  # Prints an sgnl:// URI to scan from the phone. Choose "Don't Transfer" --
  # signal-cli cannot consume the history archive, so accepting it wastes the
  # one-time offer.
  link:
    build:
      context: .
      dockerfile: docker/Dockerfile.signal-cli
    profiles: ["link"]
    networks: [internal]
    volumes:
      - signal-data:/data
    entrypoint: ["signal-cli", "--config", "/data", "link", "-n", "research-bot"]

  # The scheduled batch job:
  #   docker compose --profile batch run --rm batch
  # A separate service rather than `run` against `worker`, so the long-running
  # receiver is never restarted to run a batch. Both touch the same SQLite
  # cache; WAL plus busy_timeout=10000 covers the overlap, and the batch is
  # idempotent so a late double-run is harmless.
  batch:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    profiles: ["batch"]
    networks: [internal]
    volumes:
      - cache:/cache
      # The vault is the ONE place a host path is legitimately bind-mounted:
      # it is the deliverable, and it must be visible to Obsidian on Windows.
      # Supplied from .env so no host path appears in this published file.
      - ${SRB_KB_DIR:?set SRB_KB_DIR in .env}:/vault
      # roster.json, the pseudonym map, quarantine and metrics. Relative to the
      # compose file, so no host path appears here. Everything under it is
      # gitignored on the host.
      - ./var:/app/var
    environment:
      SRB_SIGNAL_HOST: signal-cli
      SRB_SIGNAL_PORT: "7583"
      SRB_GROUP_ID: ${SRB_GROUP_ID:-}
      SRB_CACHE_KEY: ${SRB_CACHE_KEY:?set SRB_CACHE_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      SRB_MAX_TASKS_PER_WINDOW: ${SRB_MAX_TASKS_PER_WINDOW:-4}
      SRB_WORTH_THRESHOLD: ${SRB_WORTH_THRESHOLD:-0.6}
      SRB_NOTIFY: ${SRB_NOTIFY:-false}
      SRB_KB_DIR: /vault
      SRB_VAR_DIR: /app/var
      # keyring has no backend inside a Linux container, so the credential
      # store the host uses is unavailable here. A separate key file is the
      # supported container path -- separate from .env on purpose, so the
      # cache key and the pseudonym key are never in one place.
      SRB_PSEUDONYM_KEY_FILE: /app/var/pseudonym.key
      SRB_FOREIGN_VAULT_DIR: ${SRB_FOREIGN_VAULT_DIR:-}
    logging: *logging
    command: ["python", "-m", "signal_research_bot.batch"]
